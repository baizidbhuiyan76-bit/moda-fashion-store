                <a href="shop.html" style="background: #111; color: #fff; padding: 14px 35px; text-decoration: none; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;">Explore Products</a>

            ];

            // ডাটাবেস থেকে প্রোডাক্ট খোঁজার ফাংশন
            function getProductDetails(id) {
                // প্রোডাক্ট আইডি অথবা নাম দিয়ে খুঁজবে
                let foundProduct = products.find(p => p.id === id || p.name === id);
                
                if (foundProduct) {
                    return { 
                        name: foundProduct.name, 
                        price: foundProduct.price.toLocaleString(), 
                        img: foundProduct.image 
                    };
                }
                
                // যদি কোনো প্রোডাক্ট ডিলিট হয়ে যায়, তখন এই ডিফল্ট ইমেজ দেখাবে
                return { 
                    name: id.replace("-", " ").toUpperCase(), 
                    price: "N/A", 
                    img: "https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?auto=format&fit=crop&w=800&q=85" 
                };
            }

            if(wlArray.length === 0) {
                grid.style.display = "none";
                empty.style.display = "block";
            } else {
                wlArray.forEach(itemName => {
                    let product = getProductDetails(itemName);
                    
                    grid.innerHTML += `
                    <div style="background: #fff; border: 1px solid #eaeaea; border-radius: 8px; overflow: hidden; text-align: center; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
                        <div style="position: relative; height: 320px; overflow: hidden;">
                            <img src="${product.img}" alt="${product.name}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;">
                        </div>
                        <div style="padding: 25px 20px;">
                            <h3 style="font-size: 16px; margin-bottom: 10px; color: #222; font-weight: 600; font-family: 'DM Sans', sans-serif;">${product.name}</h3>
                            <p style="color: #666; font-weight: 500; margin-bottom: 20px; font-size: 15px;">৳${product.price}</p>
                            <button class="remove-wl-btn" data-name="${itemName}" style="background: white; border: 1px solid #ddd; color: #ff3b30; padding: 10px 20px; border-radius: 4px; cursor: pointer; transition: 0.3s; font-weight: 600; width: 100%; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px;">
                                <i class="fa-solid fa-trash-can" style="margin-right: 5px;"></i> Remove
                            </button>
                        </div>
                    </div>`;
                });

                // Remove Button
                document.querySelectorAll(".remove-wl-btn").forEach(btn => {
                    btn.addEventListener("click", function() {
                        let name = this.dataset.name;
                        let currentWl = JSON.parse(localStorage.getItem("modaWishlist")) || [];
                        currentWl = currentWl.filter(item => item !== name);
                        localStorage.setItem("modaWishlist", JSON.stringify(currentWl));
                        
                        if(document.querySelector(".wishlist-count")) {
                            document.querySelector(".wishlist-count").textContent = currentWl.length;
                        }
                        location.reload(); 
                    });
                });
            }
        });
